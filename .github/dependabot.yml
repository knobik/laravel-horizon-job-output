version: 2

updates:
  # Composer dependencies are all dev-only here: the package itself pins broad
  # ranges and ships no lock file, so these PRs only move the test toolchain.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - '*'
