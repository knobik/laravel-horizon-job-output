name: horizon canary

# This package hooks into three Horizon internals that carry no compatibility
# guarantee: the public $keys whitelist on RedisJobRepository, the bus
# dispatcher's private $pipes property, and two string anchors in Horizon's
# layout markup. Any of them can move in a Horizon release.
#
# Running the suite against Horizon's development branch on a schedule turns
# that into a warning here rather than a bug report from a user.

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    name: horizon dev-master

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis
          coverage: none

      - name: Install Horizon from its development branch
        run: |
          composer require --no-update "laravel/horizon:dev-master"
          composer update --no-interaction --prefer-dist

      - name: Run tests
        id: tests
        run: vendor/bin/phpunit --fail-on-skipped
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Open an issue when the canary breaks
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Canary: the suite fails against laravel/horizon dev-master';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'canary',
            });

            if (existing.data.some(issue => issue.title === title)) {
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['canary'],
              body: [
                'The scheduled run against `laravel/horizon:dev-master` failed.',
                '',
                'This usually means an upcoming Horizon release changes one of the',
                'internals this package depends on:',
                '',
                '- `RedisJobRepository::$keys` (the HMGET whitelist)',
                '- `Illuminate\\Bus\\Dispatcher::$pipes` (read reflectively)',
                '- the `<router-view></router-view>` or `</body>` layout anchors',
                '- the trailing `export { … as Terminal }` in the xterm build',
                '',
                `[Failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
            });
